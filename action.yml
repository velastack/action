name: 'VelaStack Deploy'
description: 'Build a VelaStack app and deploy it to your own server over SSH.'
author: 'VelaStack'

branding:
  icon: 'upload-cloud'
  color: 'orange'

inputs:
  server:
    description: 'SSH target for the server, as user@host or host. The server must already have been prepared with `vela provision`.'
    required: true
  ssh-key:
    description: 'Private SSH key with access to the server. Store it as a repository secret and pass it here.'
    required: true
  ssh-port:
    description: 'SSH port, when the server does not listen on 22.'
    required: false
  known-hosts:
    description: 'Contents for known_hosts. When omitted the host key is fetched with ssh-keyscan on first connect.'
    required: false
  target:
    description: 'Which copy of the app to deploy: production, or a name you chose such as staging. Defaults to production.'
    required: false
  environment:
    description: 'Deprecated name for `target`. Still honoured when `target` is unset.'
    required: false
  domain:
    description: 'Hostname(s) to serve the app on, comma separated. Only needed the first time, or when it changes.'
    required: false
  project:
    description: 'Override the project name.'
    required: false
  health-path:
    description: 'Path the post-deploy health check requests.'
    required: false
  remote-db:
    description: 'Render the build against the database on the server, over the SSH connection. Left unset, the CLI decides: on once the target has been deployed to, which is what keeps pages prerendered from data off a runner''s empty database. Set false to build against a throwaway one.'
    required: false
  working-directory:
    description: 'Directory holding the app, when it is not the repository root.'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version to build with. Defaults to .nvmrc or .node-version in the project, then to 24.'
    required: false
  install:
    description: 'Run `npm ci` before deploying. Turn off if an earlier step already installed dependencies.'
    required: false
    default: 'true'
  vela-version:
    description: 'Version of the vela CLI to run, or any npx-installable spec. Defaults to the one this project pins in its devDependencies.'
    required: false
  api-key:
    description: 'velastack.dev API key, so the deploy is recorded on the linked project and previews get a free velastack.app hostname. Create one at https://velastack.dev/api-keys/new and store it as a repository secret. Without it the deploy still runs; it just is not logged.'
    required: false
  action:
    description: 'What to do: `deploy`, `destroy` (remove the target from the server), or `auto`, which deploys on every event except a closed pull request, where it removes the preview. `auto` never removes anything but a preview.'
    required: false
    default: 'auto'
  confirm-name:
    description: 'The app name, typed in full, when `action: destroy` targets production or a named environment such as staging. Never needed for previews. Requires a vela that understands `--confirm`.'
    required: false
  comment:
    description: 'On pull requests, keep one comment up to date with the preview URL.'
    required: false
    default: 'true'
  github-token:
    description: 'Token the pull request comment is posted with. Defaults to the workflow token, which needs `pull-requests: write`.'
    required: false
    default: ${{ github.token }}

outputs:
  release:
    description: 'Identifier of the release that was activated.'
    value: ${{ steps.deploy.outputs.release }}
  url:
    description: 'URL the deployed app is served on.'
    value: ${{ steps.deploy.outputs.url }}
  hostnames:
    description: 'Every hostname the target is served on, comma separated.'
    value: ${{ steps.deploy.outputs.hostnames }}
  target:
    description: 'The target that was deployed or removed, e.g. `production` or `preview:my-branch`.'
    value: ${{ steps.deploy.outputs.target }}

runs:
  using: composite
  steps:
    - name: Resolve the Node.js version
      id: node
      shell: bash
      env:
        VELA_NODE_VERSION: ${{ inputs.node-version }}
        VELA_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: ${{ github.action_path }}/scripts/node-version.sh

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.node.outputs.version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Configure SSH
      id: ssh
      shell: bash
      env:
        VELA_SSH_KEY: ${{ inputs.ssh-key }}
        VELA_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        VELA_SERVER: ${{ inputs.server }}
        VELA_SSH_PORT: ${{ inputs.ssh-port }}
      run: ${{ github.action_path }}/scripts/ssh-setup.sh

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Deploy
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VELA_SERVER: ${{ inputs.server }}
        VELA_TARGET: ${{ inputs.target }}
        VELA_ENVIRONMENT: ${{ inputs.environment }}
        VELA_DOMAIN: ${{ inputs.domain }}
        VELA_PROJECT: ${{ inputs.project }}
        VELA_HEALTH_PATH: ${{ inputs.health-path }}
        VELA_REMOTE_DB: ${{ inputs.remote-db }}
        VELA_SSH_PORT: ${{ inputs.ssh-port }}
        VELA_CLI_VERSION: ${{ inputs.vela-version }}
        VELA_IDENTITY: ${{ steps.ssh.outputs.identity }}
        VELA_API_KEY: ${{ inputs.api-key }}
        VELA_ACTION: ${{ inputs.action }}
        VELA_CONFIRM_NAME: ${{ inputs.confirm-name }}
        VELA_EVENT_NAME: ${{ github.event_name }}
        VELA_EVENT_ACTION: ${{ github.event.action }}
        VELA_HEAD_REF: ${{ github.head_ref }}
      run: ${{ github.action_path }}/scripts/deploy.sh

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && startsWith(github.event_name, 'pull_request')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        VELA_PR_NUMBER: ${{ github.event.pull_request.number }}
        VELA_OUTCOME: ${{ steps.deploy.outcome }}
        VELA_MODE: ${{ steps.deploy.outputs.mode }}
        VELA_TARGET: ${{ steps.deploy.outputs.target }}
        VELA_URL: ${{ steps.deploy.outputs.url }}
        VELA_HOSTNAMES: ${{ steps.deploy.outputs.hostnames }}
        VELA_RELEASE: ${{ steps.deploy.outputs.release }}
        VELA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: ${{ github.action_path }}/scripts/comment.sh

    - name: Remove the deploy key
      if: always()
      shell: bash
      run: rm -f "${{ steps.ssh.outputs.identity }}"
